services:
  dentalclinic-api:
    container_name: dentalclinic-api
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=DentalClinic;User Id=sa;Password=YourStrong@Password1;TrustServerCertificate=True;
      # Must match the compose service name below ("seq"), not a legacy host.
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://seq:5341/ingest/otlp/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      - sqlserver
      - seq
    networks:
      - dentalclinic-net
    restart: on-failure

  # Blazor Server UI. Same Dockerfile, second target. It reaches the API over
  # the compose network (service name), not over localhost, so ApiBaseUrl must
  # be overridden here — the appsettings default only fits the developer box.
  dentalclinic-web:
    container_name: dentalclinic-web
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "7204:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ApiBaseUrl=http://dentalclinic-api
    depends_on:
      - dentalclinic-api
    networks:
      - dentalclinic-net
    restart: on-failure

  sqlserver:
    container_name: dentalclinic-sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password1
      # Enables SQL Agent so the backup job defined in
      # containers/sqlserver/01-backup-job.sql can run on schedule.
      - MSSQL_AGENT_ENABLED=true
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      # Host-visible folder for nightly .bak files (git-ignored).
      - ./containers/sqlserver-backups:/var/opt/mssql/backups
    networks:
      - dentalclinic-net
    restart: always

  # One-shot sidecar: registers the SQL Agent backup job once after
  # sqlserver is ready. Exits when done; re-applies idempotently on `up`.
  sql-backup-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dentalclinic-sql-init
    environment:
      - SQLSERVER_HOST=sqlserver
      - SQLSERVER_USER=sa
      - SQLSERVER_PASSWORD=YourStrong@Password1
    volumes:
      - ./containers/sqlserver:/scripts:ro
    entrypoint: [ "/bin/sh", "/scripts/wait-for-sql-and-install.sh" ]
    depends_on:
      - sqlserver
    networks:
      - dentalclinic-net
    restart: "no"

  seq:
    image: datalust/seq:latest
    container_name: seq
    volumes:
      - ./containers/seq:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      - dentalclinic-net
    ports:
      - "5342:5341"
      - "8081:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - dentalclinic-net
    depends_on:
      - dentalclinic-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=YourStrongPwd
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - dentalclinic-net
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  sqlserver-data: {}
  grafana-data: {}

networks:
  dentalclinic-net:
    driver: bridge
