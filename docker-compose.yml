services:
  dentalclinic-api:
    container_name: dentalclinic-api
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=DentalClinic;User Id=sa;Password=YourStrong@Password1;TrustServerCertificate=True;
      # Must match the compose service name below ("seq"), not a legacy host.
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://seq:5341/ingest/otlp/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # Clinical images are written outside the web root; mount a named volume
      # so uploads survive container recreation.
      - Images__StoragePath=/app/App_Data/images
    volumes:
      - dentalclinic-images:/app/App_Data/images
    depends_on:
      - sqlserver
      - seq
    networks:
      - dentalclinic-net
    restart: on-failure

  # Blazor Server UI. Same Dockerfile, second target. It reaches the API over
  # the compose network (service name), not over localhost, so ApiBaseUrl must
  # be overridden here — the appsettings default only fits the developer box.
  dentalclinic-web:
    container_name: dentalclinic-web
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "7204:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ApiBaseUrl=http://dentalclinic-api
    depends_on:
      - dentalclinic-api
    networks:
      - dentalclinic-net
    restart: on-failure

  sqlserver:
    container_name: dentalclinic-sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password1
      # Enables SQL Agent so the backup job defined in
      # containers/sqlserver/01-backup-job.sql can run on schedule.
      - MSSQL_AGENT_ENABLED=true
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      # Host-visible folder for nightly .bak files (git-ignored).
      - ./containers/sqlserver-backups:/var/opt/mssql/backups
      # Scratch folder used by scripts/backup/restore-rehearsal.ps1, which
      # restores a backup here instead of touching the live database.
      - ./containers/sqlserver-restore:/var/opt/mssql/restore
    networks:
      - dentalclinic-net
    restart: always

  # One-shot sidecar: registers the SQL Agent backup job once after
  # sqlserver is ready. Exits when done; re-applies idempotently on `up`.
  sql-backup-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dentalclinic-sql-init
    environment:
      - SQLSERVER_HOST=sqlserver
      - SQLSERVER_USER=sa
      - SQLSERVER_PASSWORD=YourStrong@Password1
    volumes:
      - ./containers/sqlserver:/scripts:ro
    entrypoint: [ "/bin/sh", "/scripts/wait-for-sql-and-install.sh" ]
    depends_on:
      - sqlserver
    networks:
      - dentalclinic-net
    restart: "no"

  seq:
    image: datalust/seq:latest
    container_name: seq
    volumes:
      - ./containers/seq:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      - dentalclinic-net
    ports:
      - "5342:5341"
      - "8081:80"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backup observability (Phase D2). Included in the dev stack so the metric and
  # the alert rule can be verified without a production .env or a restic bucket.
  # ---------------------------------------------------------------------------
  backup-metrics:
    image: alpine:3.20
    container_name: dentalclinic-backup-metrics
    environment:
      - BACKUP_DIR=/var/opt/mssql/backups
      - TEXTFILE_PATH=/var/lib/node_exporter/textfile
      - INTERVAL_SECONDS=60
    volumes:
      - ./containers/sqlserver-backups:/var/opt/mssql/backups:ro
      - backup-textfile:/var/lib/node_exporter/textfile
      - ./containers/backup/backup-metrics.sh:/scripts/backup-metrics.sh:ro
    entrypoint: ["/bin/sh", "/scripts/backup-metrics.sh"]
    networks:
      - dentalclinic-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: dentalclinic-node-exporter
    command: ["--collector.textfile.directory=/var/lib/node_exporter/textfile"]
    volumes:
      - backup-textfile:/var/lib/node_exporter/textfile:ro
    ports:
      - "9100:9100"
    networks:
      - dentalclinic-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # prometheus.yml points rule_files at this path; a missing file makes
      # Prometheus exit at startup, so it must be mounted in every stack.
      - ./containers/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - dentalclinic-net
    depends_on:
      - dentalclinic-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=YourStrongPwd
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - dentalclinic-net
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  sqlserver-data: {}
  grafana-data: {}
  dentalclinic-images: {}
  # Textfile collector exchange between backup-metrics and node-exporter.
  backup-textfile: {}

networks:
  dentalclinic-net:
    driver: bridge
